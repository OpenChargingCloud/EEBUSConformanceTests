name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Manual runs from the Actions tab ("Run workflow"), same as nightly.yml.
  workflow_dispatch:

concurrency:
  # Pull requests: one run per branch, newest wins — a run against a head that has been
  # superseded is answering a question nobody is asking any more.
  #
  # Pushes: one run per commit, and nothing cancels anything. A commit with no verdict is
  # a hole nobody comes back to fill: the next commit contains it, so the code does get
  # tested eventually, but once that run is red there is no longer any way to say which of
  # the two commits did it.
  #
  # Keying the group on the SHA, rather than only turning cancel-in-progress off, is what
  # makes that hold for more than two pushes: a group keeps at most one run *pending*, so
  # a third push discards the second before it ever starts.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    name: Build and test (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # One leg per platform this suite is expected to work on:
    #
    #  * Debian 13, because that is what the stack runs on in production. GitHub offers no
    #    Debian runner image, so this leg runs on an Ubuntu runner inside a debian:13
    #    container. Deliberately NOT the official .NET SDK image: that is still
    #    Debian-12-based with OpenSSL 3.0, and this is the leg that has to answer what SHIP
    #    does on the OpenSSL version production actually has.
    #  * Windows, because SHIP carries its mutual TLS handshake over WebSockets and finds
    #    its peers via mDNS — certificate chain building goes through Schannel and
    #    CryptoAPI here, which behaves differently from OpenSSL.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most valuable
    # signal this matrix produces, so one leg must not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
          - os: windows-latest
            leg: windows-latest

    steps:

      # FIRST, before the checkout — unlike Hermod, where this step sits after it. The bare
      # debian:13 image has no git, and actions/checkout silently falls back to downloading
      # a tarball through the REST API when it cannot find one. That yields a working tree
      # with no .git directory, and the very next step — "git submodule update" — then fails
      # on a repository that is not a repository. So git has to exist before anything is
      # fetched.
      #
      # The rest are the .NET runtime prerequisites that setup-dotnet needs before it can
      # install the SDK: curl for the dotnet-install script itself, ICU and tzdata for
      # globalization, OpenSSL for crypto, ca-certificates for NuGet and git over HTTPS.
      # Package names verified on Debian 13 (trixie).
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata
          # Everything in this container runs as root while the workspace comes from the
          # host, which git reads as dubious ownership and refuses to touch. checkout sets
          # this for the repository itself; the submodule working trees below are not
          # covered by that.
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7

      # Not "submodules: recursive": libs/devices contains a path with a colon
      # (vaillant/arotherm-vwl-75:6a), which cannot be checked out on Windows.
      - name: Checkout submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 \
            libs/Styx libs/Hermod libs/WWCP_EEBUS \
            libs/ship-go libs/spine-go libs/eebus-go

      - name: Checkout device recordings (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: git submodule update --init --depth 1 libs/devices

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EEBUSConformanceTests.sln

      - name: Build
        run: dotnet build EEBUSConformanceTests.sln --no-restore --configuration Release

      # The protocol stack itself lives in the WWCP_EEBUS submodule and brings its own tests.
      # "LocalNetwork" is excluded: those tests need multicast and a free port 5353,
      # which a CI runner does not reliably provide — nightly.yml runs them non-fatally.
      #
      # WWCP_EEBUS now runs this same suite in its own CI, but there it builds against
      # Hermod and Styx *master*, while this leg builds against the submodule pins. Both
      # are worth having: this one says "the pinned stack passes", the other says "the
      # stack still passes against what its foundations look like today".
      - name: Build and test the EEBUS protocol stack
        timeout-minutes: 30
        working-directory: libs/WWCP_EEBUS
        run: |
          dotnet build WWCP_EEBUS.sln --configuration Release
          dotnet test  WWCP_EEBUS.sln --no-build --configuration Release --filter "TestCategory!=LocalNetwork" --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=${{ matrix.leg }}-stack" --results-directory artifacts

      # "Interop" is excluded here and runs in the job below, which is the only one that
      # sets up a Go toolchain.
      - name: Test
        timeout-minutes: 45
        run: dotnet test EEBUSConformanceTests.sln --no-build --configuration Release --filter "TestCategory!=Interop" --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=${{ matrix.leg }}-conformance" --results-directory artifacts

      # The console log answers "did it pass" and almost nothing else. Finding the one red
      # case among 267 conformance tests means pulling the whole step log and grepping it —
      # and a skip reason never reaches the console at normal verbosity at all. TRX keeps
      # both per test: outcome, duration, error message, stack trace and the Assert.Ignore
      # reason. It also survives the run: `gh run download` gets structured results where
      # the log view needs a signed-in browser session.
      #
      # LogFilePrefix, not LogFileName: the solution holds three test projects, and a fixed
      # file name makes all three write the same .trx — the last one to finish silently wins
      # and the other two results are gone. The prefix keeps the leg readable in the file
      # name and lets VSTest disambiguate the rest.
      #
      # !cancelled() rather than success(): a red run is when these files matter most, so
      # uploading only on green would discard the evidence in exactly that case. A build
      # that fails before the test step leaves no .trx, which upload-artifact reports as a
      # warning rather than a second failure — the compile error is the finding there.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: |
            artifacts/*.trx
            libs/WWCP_EEBUS/artifacts/*.trx


  interop:
    name: Interoperability against the Go reference implementations
    runs-on: ubuntu-latest
    container: debian:13

    steps:

      # Same as in the job above — git before the checkout, or the submodule step fails on
      # a tarball that is not a git repository. Plus gcc and libc6-dev: "go build" turns
      # cgo on whenever a C compiler is available and errors out on a package that needs
      # one when it is not, and the debian:13 base image ships no compiler at all. Two
      # small packages are cheaper than a red run that only says "exec: gcc: not found".
      - name: Install prerequisites (Debian container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc libc6-dev libicu76 libssl3t64 libstdc++6 tzdata
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 \
            libs/Styx libs/Hermod libs/WWCP_EEBUS \
            libs/ship-go libs/spine-go libs/eebus-go libs/devices

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # ship-go/spine-go/eebus-go require Go 1.24 (spine-go and eebus-go even pin
      # "toolchain go1.24.4"), so anything older would force a toolchain download.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            libs/ship-go/go.sum
            libs/spine-go/go.sum
            libs/eebus-go/go.sum

      - name: Build the Go reference implementations
        shell: bash
        run: |
          for module in ship-go spine-go eebus-go; do
            echo "::group::building $module"
            (cd "libs/$module" && go build ./...)
            echo "::endgroup::"
          done

      - name: Build
        run: dotnet build EEBUSConformanceTests.sln --configuration Release

      # These start the Go implementations as external peers and talk SHIP/SPINE to them
      # over loopback, so they are slower and more timing-dependent than the rest of the
      # suite. The timeout is a runaway guard, not an expectation.
      - name: Interoperability tests
        timeout-minutes: 45
        run: dotnet test EEBUSConformanceTests.sln --no-build --configuration Release --filter "TestCategory=Interop" --logger "console;verbosity=normal" --logger "trx;LogFilePrefix=interop" --results-directory artifacts

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-interop
          path: artifacts/*.trx
